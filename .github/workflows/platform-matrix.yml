# SPDX-License-Identifier: GPL-3.0-or-later
name: Platform matrix

# The hosted-runner cells of the platform matrix (docs/platforms.md): the GUI build, the
# test suite, and the cell tests of tools/matrix/run_cell.py on each operating system and
# version. It runs every night, on request, and on a pull request that changes the matrix
# itself. It is not part of the pull request gate, which stays short (standard 11.2). The
# guest cells run on the owner's machine through tools/vm.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/platform-matrix.yml"
      - "tools/matrix/**"

permissions: {}

concurrency:
  group: platform-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cell:
    name: Cell ${{ matrix.cell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: ubuntu-24.04,     os: ubuntu-24.04,     compiler: gcc,  preset: linux-release-gui }
          - { cell: ubuntu-26.04,     os: ubuntu-26.04,     compiler: gcc,  preset: linux-release-gui }
          - { cell: windows-2025,     os: windows-2025,     compiler: msvc, preset: windows-msvc-release-gui }
          - { cell: macos-15,         os: macos-15,         compiler: none, preset: macos-release-gui }
          - { cell: macos-26,         os: macos-26,         compiler: none, preset: macos-release-gui }
          - { cell: macos-15-intel,   os: macos-15-intel,   compiler: none, preset: macos-release-gui }
          - { cell: macos-26-intel,   os: macos-26-intel,   compiler: none, preset: macos-release-gui }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          qt: "true"

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # T1. A failure here does not stop the cell tests: they report what they find.
      - name: Build and run the suite
        id: suite
        continue-on-error: true
        uses: ./.github/actions/build-and-test
        with:
          preset: ${{ matrix.preset }}
          keep-going: "true"

      - name: Run the cell tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          PRESET: ${{ matrix.preset }}
          RUNNER_LABEL: ${{ matrix.os }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          PY=python
          command -v python3 >/dev/null 2>&1 && PY=python3
          suite=1
          [ "$SUITE_OUTCOME" = success ] && suite=0
          "$PY" tools/matrix/run_cell.py --cell "$CELL" --build-dir "build/$PRESET" --out out \
            --commit "$COMMIT" --runner-label "$RUNNER_LABEL" --workflow-run "$RUN_ID" --t1-exit "$suite"

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.cell }}
          path: out
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Matrix result
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results

      - name: Merge the results
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 tools/matrix/merge_results.py results --check > table.md || status=$?
          { echo "## Platform matrix"; echo; cat table.md; } >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          exit "$status"

      - name: Open the nightly issue
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          engine: Platform matrix
          detail: A hosted cell of the platform matrix failed a test or did not run one. The run summary has the table and the artifacts have the logs.
