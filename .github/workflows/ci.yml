# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The pull request gate. Pull requests (drafts included) run the static checks. Ready pull
# requests and merge-queue entries also build. Required status checks are the two jobs
# defined here by name, "CI Status" and "Scan dependency diff": a check from a called
# workflow carries the caller's job name as a prefix, so it cannot be required by its plain name.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/policy.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      driver: ${{ steps.driver.outputs.driver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      - name: Check the vendored CMake modules
        run: python3 tools/sync_cmake.py --infra .icl-infra --check
      - name: Decide scope
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            git diff --name-only "$BASE_SHA"...HEAD | python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json >> "$GITHUB_OUTPUT"
          else
            python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json --force-all >> "$GITHUB_OUTPUT"
          fi
      # The driver build runs on a Windows runner for each architecture, so it
      # runs only when the driver or the gate itself changed.
      - name: Decide driver scope
        id: driver
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          driver=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            if ! git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(drivers/windows/|\.github/workflows/ci\.yml|\.github/ci/|\.github/toolchain-versions\.json)'; then
              driver=false
            fi
          fi
          echo "driver=$driver" >> "$GITHUB_OUTPUT"

  changelog:
    runs-on: ubuntu-latest
    name: Changelog fragments
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the changelog
        run: |
          python3 tools/changelog.py --check
          python3 -m unittest discover -s tools -p "test_*.py" -v

  design:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check contrast
        run: python3 tools/check_contrast.py
      - name: Render the theme style sheets
        run: python3 tools/gen_qss.py --out "${RUNNER_TEMP}/qss"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-gcc
            compiler: gcc
            preset: linux-release
          - os: ubuntu-26.04
            name: linux-clang
            compiler: clang
            preset: linux-release
          - os: windows-2025
            name: windows-msvc
            compiler: msvc
            preset: windows-msvc-release
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
      - uses: ./.github/actions/prepare-deps
      - uses: ./.github/actions/build-and-test
        with:
          preset: ${{ matrix.preset }}

  macos:
    runs-on: macos-26
    name: Build and test (macos-appleclang)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/prepare-deps
      - uses: ./.github/actions/build-and-test
        with:
          preset: macos-release

  gui:
    runs-on: ubuntu-26.04
    name: Qt GUI (offscreen self-test)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          qt: "true"

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Configure
        run: cmake --preset linux-release-gui

      - name: Build
        run: cmake --build --preset linux-release-gui

      - name: GUI self-test
        run: QT_QPA_PLATFORM=offscreen ./build/linux-release-gui/bin/vss_gui --selftest

  coverage:
    runs-on: ubuntu-26.04
    name: Coverage (90% statements, 80% branches)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang

      - uses: ./.github/actions/prepare-deps

      - name: Put the LLVM tools on the path
        run: |
          LLVM=$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json'))['llvm'])")
          echo "/usr/lib/llvm-$LLVM/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build --preset linux-coverage

      - name: Create a serial pair for the system tests
        shell: bash
        run: |
          : > pty.txt
          python3 tools/pty_loopback.py > pty.txt &
          for i in $(seq 1 100); do
            [ "$(wc -l < pty.txt)" -ge 2 ] && break
            sleep 0.2
          done
          A=$(sed -n 1p pty.txt)
          B=$(sed -n 2p pty.txt)
          [ -n "$A" ] && [ -n "$B" ] || { echo "no pty pair" >&2; exit 1; }
          echo "VSS_LOOPBACK_A=$A" >> "$GITHUB_ENV"
          echo "VSS_LOOPBACK_B=$B" >> "$GITHUB_ENV"
          echo "VSS_REQUIRE_LOOPBACK=1" >> "$GITHUB_ENV"

      - name: Run the suites with profiling
        run: |
          mkdir -p build/linux-coverage/profiles
          export LLVM_PROFILE_FILE="$PWD/build/linux-coverage/profiles/%p-%m.profraw"
          ./build/linux-coverage/bin/vss_unit_tests --junit=unit.xml
          ./build/linux-coverage/bin/vss_system_tests --junit=system.xml

      - name: Enforce the gates
        run: |
          python3 tools/coverage_report.py --build build/linux-coverage \
            --exclude libs/vss_testkit \
            --gate-exclude libs/vss_ports/src/vcom_driver.cpp \
            --min-lines 90 --min-branches 80 \
            --markdown coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  performance:
    runs-on: ubuntu-26.04
    name: Performance floors
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc

      - uses: ./.github/actions/prepare-deps

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Measure and gate
        run: |
          ./build/linux-release/bin/vss_perf --output=perf-results.json
          python3 tools/perf_report.py perf-results.json --floors perf/floors.json \
            --markdown | tee perf.md
          cat perf.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            perf-results.json
            perf.md

  profiling:
    runs-on: ubuntu-26.04
    name: End-to-end profiling (Tracy)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      TRACY_VERSION: v0.14.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc

      - uses: ./.github/actions/prepare-deps

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Tracy's tools fetch CPM.cmake and their own sources from GitHub when they are
      # configured, and a refused download fails the job before any of this project builds.
      # The built tools are kept in the cache, so a run normally downloads nothing, and the
      # build is retried when it does have to download.
      - name: Restore the Tracy command line tools
        id: tracy-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tracy-tools
          key: tracy-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.TRACY_VERSION }}

      - name: Build the Tracy command line tools
        if: steps.tracy-tools.outputs.cache-hit != 'true'
        run: |
          source_dir="tracy-${TRACY_VERSION#v}"
          build_tools() {
            rm -rf tracy-src.tar.gz "$source_dir" tracy-tools &&
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 5               "https://github.com/wolfpld/tracy/archive/refs/tags/${TRACY_VERSION}.tar.gz"               -o tracy-src.tar.gz &&
            tar xzf tracy-src.tar.gz &&
            cmake -S "$source_dir/capture" -B tracy-tools/capture -DCMAKE_BUILD_TYPE=Release &&
            cmake --build tracy-tools/capture --parallel &&
            cmake -S "$source_dir/csvexport" -B tracy-tools/csvexport -DCMAKE_BUILD_TYPE=Release &&
            cmake --build tracy-tools/csvexport --parallel
          }
          for attempt in 1 2 3; do
            build_tools && exit 0
            echo "Building the Tracy tools failed (attempt $attempt of 3)." >&2
            sleep $((attempt * 20))
          done
          exit 1

      - name: Keep the Tracy command line tools
        if: steps.tracy-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tracy-tools
          key: ${{ steps.tracy-tools.outputs.cache-primary-key }}

      - name: Configure with instrumentation
        run: cmake --preset linux-tracy

      - name: Build
        run: cmake --build --preset linux-tracy --target vss_perf --parallel

      - name: Create a serial pair for the terminal path
        run: |
          : > pty.txt
          python3 tools/pty_loopback.py > pty.txt &
          for i in $(seq 1 100); do
            [ "$(wc -l < pty.txt)" -ge 2 ] && break
            sleep 0.2
          done
          A=$(sed -n 1p pty.txt)
          B=$(sed -n 2p pty.txt)
          [ -n "$A" ] && [ -n "$B" ] || { echo "no pty pair" >&2; exit 1; }
          echo "VSS_LOOPBACK_A=$A" >> "$GITHUB_ENV"
          echo "VSS_LOOPBACK_B=$B" >> "$GITHUB_ENV"

      - name: Capture and report
        run: |
          ./tracy-tools/capture/tracy-capture -o tracy.trace -s 120 &
          CAP=$!
          sleep 2
          ./build/linux-tracy/bin/vss_perf --tracy | tee perf-tracy.txt
          wait $CAP
          ./tracy-tools/csvexport/tracy-csvexport tracy.trace > tracy.csv
          echo "### Tracy zones" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/tracy_report.py tracy.csv \
            --require perf.e2e.tcp,perf.e2e.pty,perf.e2e.pty.chunk,hub.route,config.to_json \
            --markdown tracy-report.md --json tracy-zones.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracy-profile
          path: |
            tracy.trace
            tracy.csv
            tracy-report.md
            tracy-zones.json
            perf-tracy.txt

      - name: Save caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
  asan-ubsan:
    runs-on: ubuntu-26.04
    name: AddressSanitizer and UBSan
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang

      - uses: ./.github/actions/prepare-deps

      - uses: ./.github/actions/build-and-test
        with:
          preset: linux-asan-ubsan

  # Builds the libFuzzer targets and replays the seed corpus and the regression inputs under AddressSanitizer
  # and UBSan. The fuzz workflow does the fuzzing itself, on pushes to develop and at night.
  fuzz-regress:
    runs-on: ubuntu-26.04
    name: Fuzz regression replay
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang

      - uses: ./.github/actions/prepare-deps

      - name: Configure
        run: cmake --preset linux-fuzz

      - name: Build
        run: cmake --build --preset linux-fuzz

      - name: Replay
        run: python3 tools/fuzz.py --mode regress

      - name: Test the runner
        run: python3 -m unittest discover -s tools -p "test_fuzz.py" -v

  # Threading findings come from timing, so this leg runs for merge-queue entries and pushes, not for every pull request.
  tsan:
    runs-on: ubuntu-26.04
    name: ThreadSanitizer
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && github.event_name != 'pull_request'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang

      - uses: ./.github/actions/prepare-deps

      - uses: ./.github/actions/build-and-test
        with:
          preset: linux-tsan

  driver:
    name: Windows driver (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.driver == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows SDK and the WDK are NuGet packages, about a gigabyte of them.
      - name: Cache the NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-driver-${{ hashFiles('drivers/windows/vsscom/vsscom.vcxproj') }}
      - name: Build, verify and package the driver
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./drivers/windows/build.ps1 -Platform $env:PLATFORM
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsscom-${{ matrix.platform }}
          path: drivers/windows/artifacts/package/${{ matrix.platform }}/
          if-no-files-found: error

  zizmor:
    name: Workflow analysis
    permissions:
      contents: read
      security-events: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/zizmor.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  dependency-scan:
    name: Scan dependency diff
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: iainchesworthlabs/icl-common-infra/actions/dependency-review@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  ci-status:
    name: CI Status
    if: always()
    needs: [policy, plan, changelog, design, build, macos, gui, coverage, performance, profiling, asan-ubsan, fuzz-regress, tsan, driver, zizmor, dependency-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate
        uses: iainchesworthlabs/icl-common-infra/actions/ci-status@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {
              "build": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "macos": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "gui": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "coverage": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "performance": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "profiling": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "asan-ubsan": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "fuzz-regress": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "tsan": ${{ needs.plan.outputs.build == 'true' && github.event_name != 'pull_request' }},
              "driver": ${{ needs.plan.outputs.driver == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "dependency-scan": ${{ github.event_name != 'push' }}
            }
