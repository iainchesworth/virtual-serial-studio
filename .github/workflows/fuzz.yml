# SPDX-License-Identifier: GPL-3.0-or-later
name: Fuzz

# fuzz-short runs on every push to develop (60 seconds a target). fuzz-nightly
# runs once a night (10 minutes a target) and keeps the working corpus between
# runs in the Actions cache. The pull request gate replays the seed corpus and
# the regression inputs in ci.yml. A crash fails the run, uploads the input as
# an artifact and, at night, opens a nightly-analysis issue. Add the input to
# libs/<lib>/fuzz/regressions/ with the fix.

on:
  push:
    branches: [develop]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: How long to fuzz each target.
        type: choice
        options: [short, nightly]
        default: short

permissions: {}

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose how long to fuzz
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule) mode=nightly ;;
            workflow_dispatch) mode="$REQUESTED" ;;
            *) mode=short ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang

      - uses: ./.github/actions/prepare-deps

      - name: Restore the working corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fuzz/fuzz_*
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Configure
        run: cmake --preset linux-fuzz

      - name: Build
        run: cmake --build --preset linux-fuzz

      - name: Replay the seeds and the regressions
        run: python3 tools/fuzz.py --mode regress

      - name: Fuzz
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: python3 tools/fuzz.py --mode "$MODE"

      # Saved after the nightly and after a manual run, not after every push.
      - name: Save the working corpus
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fuzz/fuzz_*
          key: fuzz-corpus-${{ github.run_id }}

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: .cache/fuzz/artifacts
          if-no-files-found: ignore

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          engine: libFuzzer
          detail: A fuzz target crashed, timed out or ran out of memory, or the fuzz build failed. The run keeps the crashing input as the fuzz-crashes artifact. Fix the bug and add the input to libs/<lib>/fuzz/regressions/.
