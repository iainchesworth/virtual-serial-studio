name: Dependabot auto-merge

# Enables auto-merge on Dependabot pull requests that only move GitHub Actions by a minor or
# patch version. The merge queue then takes the pull request once CI Status passes. The vcpkg
# baseline and every major update are left for a person.

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
    with:
      ecosystems: github_actions
      merge-method: ""
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
