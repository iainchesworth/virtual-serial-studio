# Temporary: builds the driver on push.
name: Driver probe
on:
  push:
    branches: [feature/vsscom-driver-io]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-driver-${{ hashFiles('drivers/windows/vsscom/vsscom.vcxproj') }}
      - shell: pwsh
        run: ./drivers/windows/build.ps1 -Platform ${{ matrix.platform }}
