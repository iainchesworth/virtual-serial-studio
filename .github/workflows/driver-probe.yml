# Temporary: runs the driver build script on the hosted Windows image.
name: Driver probe

on:
  push:
    branches: [feature/windows-driver-package]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        shell: pwsh
        run: ./drivers/windows/build.ps1 -Platform ${{ matrix.platform }}
