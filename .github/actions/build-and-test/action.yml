# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and test
description: >
  Configure, build and run the full suite. Shared by the matrix job and the
  opt-in macOS job so the two cannot drift.

inputs:
  preset:
    description: The configure, build and test preset to use.
    required: true
  keep-going:
    description: >
      true to let the build continue past a failing target, so the programs that do build can
      still be tested. The build step still fails if any target failed.
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
      run: cmake --preset "$PRESET"

    - name: Build
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        KEEP_GOING: ${{ inputs.keep-going }}
      run: |
        if [ "$KEEP_GOING" = true ]; then
          cmake --build --preset "$PRESET" -- -k 0
        else
          cmake --build --preset "$PRESET"
        fi

    - name: Create a serial pair for the system tests
      if: runner.os != 'Windows'
      shell: bash
      run: | # zizmor: ignore[github-env] the values are pseudo terminal paths written by tools/pty_loopback.py in this job
        : > pty.txt
        python3 tools/pty_loopback.py > pty.txt &
        for i in $(seq 1 100); do
          [ "$(wc -l < pty.txt)" -ge 2 ] && break
          sleep 0.2
        done
        A=$(sed -n 1p pty.txt)
        B=$(sed -n 2p pty.txt)
        [ -n "$A" ] && [ -n "$B" ] || { echo "no pty pair" >&2; exit 1; }
        echo "VSS_LOOPBACK_A=$A" >> "$GITHUB_ENV"
        echo "VSS_LOOPBACK_B=$B" >> "$GITHUB_ENV"
        echo "VSS_REQUIRE_LOOPBACK=1" >> "$GITHUB_ENV"

    - name: Test
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
      run: ctest --preset "$PRESET"
